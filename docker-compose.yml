services:
  gateway:
    build: .
    ports: ["8000:8000"]
    environment:
      SOVEREIGN_UPSTREAM: http://target:8001/mcp
      SOVEREIGN_AUDIT_KEY: ${SOVEREIGN_AUDIT_KEY:-change-me-please}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    volumes:
      - ./policy.yaml:/app/policy.yaml:ro
      - ./data:/data
    depends_on: [target]
  target:
    build: .
    command: ["uvicorn", "target_mcp_server:app", "--host", "0.0.0.0", "--port", "8001"]
