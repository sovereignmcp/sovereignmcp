[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereignmcp"
version = "0.1.0"
description = "Zero-trust gateway for AI agent tool calls: per-person permissions, deep argument inspection, human approvals, tamper-evident audit."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Shashank M" }]
keywords = ["mcp", "model-context-protocol", "ai-agents", "security", "zero-trust", "approvals"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "httpx>=0.27.0",
  "pyyaml>=6.0.2",
  "sqlglot>=25.0.0",
  "cryptography>=43.0.0",
]

[project.optional-dependencies]
bridges = ["requests>=2.32.0", "slack-bolt>=1.20.0"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/sovereignmcp/sovereignmcp"
Issues = "https://github.com/sovereignmcp/sovereignmcp/issues"

[project.scripts]
sovereignmcp = "sovereignmcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
